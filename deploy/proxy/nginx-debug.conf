# Pearlie debug API (T-417 / D-34): /api/debug/ may skip the proxy login.
# It needs the debug key, is GET-only and returns no secrets or media.
# Put this block BEFORE the login-protected `location /` block.
#
# Rules that keep the bypass narrow:
#  - merge_slashes on: `//api/debug` becomes `/api/debug` before matching.
#  - `^~` is a case-sensitive prefix match: `/API/DEBUG/` does not match
#    and stays behind the login.
#  - proxy_pass has a FIXED upstream path: the part after the location is
#    appended to /api/debug/ only, so `..` forms cannot reach other routes
#    (the backend also answers 401 to such paths).
#  - the key is sent only in the Authorization header, never in the URL.

merge_slashes on;

location ^~ /api/debug/ {
    # no auth_request / auth_basic here: the debug key is the check
    proxy_pass http://pearlie/api/debug/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
}
